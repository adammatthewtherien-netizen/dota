name: Sync TI 2026 YouTube VODs

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sync official Dota 2 uploads
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/sync-youtube.mjs
      - name: Commit new VODs
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "ti-vod-bot"
          git config user.email "actions@users.noreply.github.com"
          git add matches.json
          git commit -m "Auto-add TI 2026 VODs"
          git push
